[project]
name = "celebrity-doppelganger-training"
version = "0.1.0"
description = "Supervised contrastive face classifier training pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "facenet-pytorch>=2.6.0,<3",
    "lancedb==0.21.2",
    "numpy>=1.26,<3",
    "pillow>=10,<12",
    "pyarrow>=18,<23",
    "requests>=2.32,<3",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "uvicorn[standard]>=0.34,<1",
    "wandb>=0.19,<1",
    "dvc-s3>=3.2,<4",
]

[dependency-groups]
dev = [
    "cbor2==5.6.5",
    "dvc>=3.50,<4",
    "httpx>=0.28,<1",
    "modal>=1.0,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
